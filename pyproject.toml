[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebb"
version = "0.1.0"
description = "EBB research code for pooling and forgetting in intermittent-demand forecasting"
authors = [{name = "Zong-Han Bai"}, {name = "Po-Yen Chu"}]
requires-python = ">=3.10,<3.11"
dependencies = [
	"numpy==1.26.4",
	"pandas==2.3.1",
	"scipy==1.15.3",
	"scikit-learn>=1.7,<1.8",
	"statsforecast==2.0.2",
	"matplotlib==3.10.3",
	"neuralforecast==3.1.2",
    "coreforecast==0.0.16",
    "utilsforecast==0.2.12",
	"torch==2.6.0",
	"pytorch-lightning==2.5.2",
	"lightning-utilities==0.14.3",
	"torchmetrics==1.5.2",
	"optuna==4.4.0",
	"ray==2.48.0",
	"tqdm==4.67.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "sympy==1.13.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
	"data_loading",
	"metrics",
	"plotting",
	"utils",
]

